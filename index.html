<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RICCI 注文金額計算ツール</title><style>body{font-family:'Yu Gothic',Meiryo,sans-serif;background:#f6f7f4;color:#27342c;margin:0;padding:28px}main{max-width:640px;margin:auto;background:white;padding:30px;border-radius:18px;box-shadow:0 8px 30px #0001}h1{font-size:24px;color:#315c40}label{display:block;margin:18px 0 8px;font-weight:bold}input[type=number],select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #aab9ad;border-radius:8px;font-size:18px}section{padding:18px;background:#f0f5f0;border-radius:10px;margin-top:22px}.line{display:flex;justify-content:space-between;margin:10px 0}.total{font-size:26px;font-weight:bold;color:#225b39}button{width:100%;background:#315c40;color:white;border:0;border-radius:9px;padding:15px;font-size:17px;cursor:pointer;margin-top:16px}small{color:#59675c;line-height:1.7;display:block;margin-top:14px}#status{min-height:1.5em;color:#225b39}</style></head><body><main><h1>RICCI 注文金額計算ツール</h1><p>「RICCIのRICHな田作り（胡桃入り）」の注文金額を計算します。</p><label for="home">ご家庭用（240g・税込2,200円）</label><input id="home" type="number" min="0" step="1" value="0"><label for="gift">贈答用（240g・税込2,500円）</label><input id="gift" type="number" min="0" step="1" value="0"><label for="ship">配送方法</label><select id="ship"><option value="click">クリックポスト（200円／商品1個）</option><option value="yamato">宅急便（着払い）</option><option value="cool">クール宅急便・冷蔵（着払い）</option></select><section><div class="line"><span>商品代金</span><span id="subtotal">0円</span></div><div class="line"><span>送料</span><span id="freight">0円</span></div><hr><div class="line total"><span>お振込み合計</span><span id="total">0円</span></div></section><button id="copy">注文内容をコピー</button><p id="status" role="status"></p><small>※クリックポストは商品1個につき1通として計算します。宅急便・クール宅急便の送料はお受け取り時の着払いで、振込金額には含めません。発送方法・梱包条件は注文ごとに確認してください。<br>※このツールは端末内で計算し、注文情報を外部へ送信しません。</small></main><script>const $=id=>document.getElementById(id),fmt=n=>n.toLocaleString('ja-JP')+'円';function count(id){const x=Number($(id).value);return Number.isSafeInteger(x)&&x>=0?x:0}function calc(){const h=count('home'),g=count('gift'),s=$('ship').value,sub=h*2200+g*2500,fr=s==='click'?(h+g)*200:0;$('subtotal').textContent=fmt(sub);$('freight').textContent=s==='click'?fmt(fr):'着払い（別途）';$('total').textContent=fmt(sub+fr);return {h,g,s,sub,fr,total:sub+fr}}['home','gift','ship'].forEach(id=>$(id).addEventListener('input',()=>{calc();$('status').textContent=''}));$('copy').addEventListener('click',async()=>{const {h,g,s,sub,fr,total}=calc();if(h+g===0){$('status').textContent='商品数量を入力してください。';return}const shipping=s==='click'?fmt(fr)+'（クリックポスト）':(s==='yamato'?'宅急便':'クール宅急便（冷蔵）')+'・着払い';const msg=`【ご注文内容】\n・ご家庭用（240g）：${h}個 × 2,200円 ＝ ${fmt(h*2200)}\n・贈答用（240g）：${g}個 × 2,500円 ＝ ${fmt(g*2500)}\n商品代金合計：${fmt(sub)}\n送料：${shipping}\nお振込み合計金額：${fmt(total)}`;try{await navigator.clipboard.writeText(msg);$('status').textContent='注文内容をコピーしました。'}catch(e){const t=document.createElement('textarea');t.value=msg;document.body.append(t);t.select();const ok=document.execCommand('copy');t.remove();$('status').textContent=ok?'注文内容をコピーしました。':'コピーできませんでした。ブラウザの設定をご確認ください。'}});calc();</script></body></html>
